# Production Helm values for Polyglot eCommerce Platform on AWS EKS
global:
  imageRegistry: 623174465382.dkr.ecr.ap-southeast-2.amazonaws.com
  imageRepository: ecommerce-platform
  imagePullPolicy: IfNotPresent

# Default configuration for dedicated databases (Database-per-Service architecture)
databaseDefaults:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  storageClassName: gp3
  storageSize: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Pod Disruption Budget for high availability during node drain / updates
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# 1. Auth Service (Java 21 / Spring Boot) + Dedicated auth-db
auth:
  enabled: true
  tag: auth-service-9d606d1f57e3482fc1959719550013499b79c86a
  replicaCount: 2
  service:
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  database:
    enabled: true
    host: auth-db
    port: 5432
    name: auth_db
    user: auth_user
    password: auth_db_password_123
    storageSize: 5Gi
    storageClassName: gp3

