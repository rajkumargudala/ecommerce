{{- $databases := list "auth" "catalog" "inventory" "order" "payment" "notification" "analytics" "cart" "shipping" "reviews" "promotions" "search" -}}
{{- range $svc := $databases }}
{{- $cfg := index $.Values $svc }}
{{- if and $cfg.enabled $cfg.database.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $svc }}-db-secret
  labels:
    app: {{ $svc }}-db
    service: {{ $svc }}
    {{- include "ecommerce.labels" $ | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ $cfg.database.name | quote }}
  POSTGRES_USER: {{ $cfg.database.user | quote }}
  POSTGRES_PASSWORD: {{ $cfg.database.password | quote }}
  username: {{ $cfg.database.user | quote }}
  password: {{ $cfg.database.password | quote }}
  database: {{ $cfg.database.name | quote }}
  host: {{ $cfg.database.host | quote }}
  port: {{ $cfg.database.port | quote }}
{{- end }}
{{- end }}

