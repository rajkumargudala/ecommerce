{{- if .Values.catalog.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.catalog.replicaCount }}
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageRepository }}:{{ .Values.catalog.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.catalog.service.port }}
              name: http
          env:
            - name: CATALOG_DB_DSN
              value: "postgres://{{ .Values.postgres.dbUser }}:{{ .Values.postgres.dbPassword }}@postgres:5432/catalog_db?sslmode=disable"
          resources:
            {{- toYaml .Values.catalog.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.catalog.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.catalog.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
{{- end }}

