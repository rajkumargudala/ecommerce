{{- $services := list "cart" "shipping" "reviews" "promotions" "search" -}}
{{- range $svc := $services }}
{{- $cfg := index $.Values $svc }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc }}-service
  labels:
    app: {{ $svc }}-service
    {{- include "ecommerce.labels" $ | nindent 4 }}
spec:
  replicas: {{ $cfg.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ $svc }}-service
  template:
    metadata:
      labels:
        app: {{ $svc }}-service
    spec:
      containers:
        - name: {{ $svc }}-service
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.global.imageRepository }}:{{ $cfg.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $cfg.service.port }}
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $svc }}-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $svc }}-db-secret
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@{{ $cfg.database.host }}:{{ $cfg.database.port }}/{{ $cfg.database.name }}?sslmode=disable"
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $cfg.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $cfg.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}-service
  labels:
    app: {{ $svc }}-service
    {{- include "ecommerce.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $cfg.service.port }}
      targetPort: {{ $cfg.service.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ $svc }}-service
{{- end }}
{{- end }}
