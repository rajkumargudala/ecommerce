{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecommerce-kafka-client
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "kafka.secretReaderRoleArn is required when Kafka is enabled" .Values.kafka.secretReaderRoleArn | quote }}
{{- end }}
