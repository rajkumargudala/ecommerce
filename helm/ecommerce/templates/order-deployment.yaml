{{- if .Values.order.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.order.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      {{- if .Values.kafka.enabled }}
      serviceAccountName: ecommerce-kafka-client
      {{- end }}
      containers:
        - name: order-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageRepository }}:{{ .Values.order.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.order.service.port }}
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: password
            - name: ORDER_DB_DSN
              value: "dbname={{ .Values.order.database.name }} user=$(DB_USER) password=$(DB_PASSWORD) host={{ .Values.order.database.host }} port={{ .Values.order.database.port }}"
            - name: CATALOG_URL
              value: "http://catalog-service:{{ .Values.catalog.service.port }}"
            - name: INVENTORY_URL
              value: "http://inventory-service:{{ .Values.inventory.service.port }}"
            - name: NOTIFICATION_URL
              value: "http://notification-service:{{ .Values.notification.service.port }}"
            {{- if .Values.kafka.enabled }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ required "kafka.bootstrapServers is required when Kafka is enabled" .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_SECRET_ARN
              value: {{ required "kafka.secretArn is required when Kafka is enabled" .Values.kafka.secretArn | quote }}
            - name: AWS_REGION
              value: {{ .Values.kafka.awsRegion | quote }}
            - name: KAFKA_ORDERS_TOPIC
              value: {{ .Values.kafka.ordersTopic | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.order.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.order.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.order.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
{{- end }}
