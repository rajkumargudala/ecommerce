{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.auth.service.port }}
      targetPort: {{ .Values.auth.service.port }}
      protocol: TCP
      name: http
  selector:
    app: auth-service
{{- end }}

