{{- if .Values.analytics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  labels:
    app: analytics-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.analytics.service.port }}
      targetPort: {{ .Values.analytics.service.port }}
      protocol: TCP
      name: http
  selector:
    app: analytics-service
{{- end }}

