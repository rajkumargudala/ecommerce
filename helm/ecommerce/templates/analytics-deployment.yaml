{{- if .Values.analytics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels:
    app: analytics-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.analytics.replicaCount }}
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageRepository }}:{{ .Values.analytics.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.analytics.service.port }}
              name: http
          env:
            - name: ANALYTICS_DB_DSN
              value: "pgsql:host=postgres;port=5432;dbname=analytics_db"
            - name: DB_USER
              value: {{ .Values.postgres.dbUser | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.postgres.dbPassword | quote }}
            - name: CATALOG_URL
              value: "http://catalog-service:{{ .Values.catalog.service.port }}"
            - name: INVENTORY_URL
              value: "http://inventory-service:{{ .Values.inventory.service.port }}"
            - name: ORDER_URL
              value: "http://order-service:{{ .Values.order.service.port }}"
            - name: PAYMENT_URL
              value: "http://payment-service:{{ .Values.payment.service.port }}"
          resources:
            {{- toYaml .Values.analytics.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.analytics.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.analytics.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
{{- end }}

