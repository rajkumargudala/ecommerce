{{- if .Values.analytics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels:
    app: analytics-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.analytics.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      securityContext:
        {{- include "ecommerce.podSecurityContext" (dict "user" 1000 "group" 1000) | nindent 8 }}
      containers:
        - name: analytics-service
          securityContext:
            {{- include "ecommerce.containerSecurityContext" (dict "user" 1000 "group" 1000) | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageRepository }}:{{ .Values.analytics.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: {{ .Values.analytics.service.port }}
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secret
                  key: password
            - name: ANALYTICS_DB_DSN
              value: "pgsql:host={{ .Values.analytics.database.host }};port={{ .Values.analytics.database.port }};dbname={{ .Values.analytics.database.name }}"
            - name: CATALOG_URL
              value: "http://catalog-service:{{ .Values.catalog.service.port }}"
            - name: INVENTORY_URL
              value: "http://inventory-service:{{ .Values.inventory.service.port }}"
            - name: ORDER_URL
              value: "http://order-service:{{ .Values.order.service.port }}"
            - name: PAYMENT_URL
              value: "http://payment-service:{{ .Values.payment.service.port }}"
          resources:
            {{- toYaml .Values.analytics.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.analytics.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.analytics.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
