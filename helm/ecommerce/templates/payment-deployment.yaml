{{- if .Values.payment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.payment.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      securityContext:
        {{- include "ecommerce.podSecurityContext" (dict "user" 1000 "group" 1000) | nindent 8 }}
      containers:
        - name: payment-service
          securityContext:
            {{- include "ecommerce.containerSecurityContext" (dict "user" 1000 "group" 1000) | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageRepository }}:{{ .Values.payment.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: {{ .Values.payment.service.port }}
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: password
            - name: PAYMENT_DB_URL
              value: "Host={{ .Values.payment.database.host }};Port={{ .Values.payment.database.port }};Database={{ .Values.payment.database.name }};Username=$(DB_USER);Password=$(DB_PASSWORD)"
            - name: ORDER_URL
              value: "http://order-service:{{ .Values.order.service.port }}"
            - name: INVENTORY_URL
              value: "http://inventory-service:{{ .Values.inventory.service.port }}"
            - name: NOTIFICATION_URL
              value: "http://notification-service:{{ .Values.notification.service.port }}"
          resources:
            {{- toYaml .Values.payment.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.payment.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.payment.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
