{{- if .Values.notification.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.notification.service.port }}
      targetPort: {{ .Values.notification.service.port }}
      protocol: TCP
      name: http
  selector:
    app: notification-service
{{- end }}

