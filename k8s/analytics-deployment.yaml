apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          # Replace with your ECR image URI, e.g. <aws_account_id>.dkr.ecr.<region>.amazonaws.com/analytics-service:latest
          image: analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
              name: http
          env:
            - name: ANALYTICS_DB_DSN
              value: "pgsql:host=postgres;port=5432;dbname=analytics_db"
            - name: DB_USER
              value: "microapp"
            - name: DB_PASSWORD
              value: "microapp123"
            - name: CATALOG_URL
              value: "http://catalog-service:8082"
            - name: INVENTORY_URL
              value: "http://inventory-service:8083"
            - name: ORDER_URL
              value: "http://order-service:8084"
            - name: PAYMENT_URL
              value: "http://payment-service:8085"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8087
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
