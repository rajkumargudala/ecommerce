apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # Replace with your ECR image URI, e.g. <aws_account_id>.dkr.ecr.<region>.amazonaws.com/auth-service:latest
          image: 877013879278.dkr.ecr.us-east-1.amazonaws.com/ecommerce-platform:auth-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: AUTH_DB_URL
              value: "jdbc:postgresql://postgres:5432/auth_db"
            - name: DB_USER
              value: "microapp"
            - name: DB_PASSWORD
              value: "microapp123"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
