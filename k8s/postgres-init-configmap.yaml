apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  labels:
    app: postgres
data:
  init.sql: |
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='microapp') THEN
        CREATE ROLE microapp LOGIN PASSWORD 'microapp123';
      ELSE
        ALTER ROLE microapp WITH LOGIN PASSWORD 'microapp123';
      END IF;
    END
    $$;

    CREATE DATABASE auth_db OWNER microapp;
    CREATE DATABASE catalog_db OWNER microapp;
    CREATE DATABASE inventory_db OWNER microapp;
    CREATE DATABASE order_db OWNER microapp;
    CREATE DATABASE payment_db OWNER microapp;
    CREATE DATABASE notification_db OWNER microapp;
    CREATE DATABASE analytics_db OWNER microapp;
