apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          # Replace with your ECR image URI, e.g. <aws_account_id>.dkr.ecr.<region>.amazonaws.com/payment-service:latest
          image: 877013879278.dkr.ecr.us-east-1.amazonaws.com/ecommerce-platform:payment-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: PAYMENT_DB_URL
              value: "Host=postgres;Port=5432;Database=payment_db;Username=microapp;Password=microapp123"
            - name: ORDER_URL
              value: "http://order-service:8084"
            - name: INVENTORY_URL
              value: "http://inventory-service:8083"
            - name: NOTIFICATION_URL
              value: "http://notification-service:8086"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
