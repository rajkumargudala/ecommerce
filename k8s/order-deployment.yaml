apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          # Replace with your ECR image URI, e.g. <aws_account_id>.dkr.ecr.<region>.amazonaws.com/order-service:latest
          image: 877013879278.dkr.ecr.us-east-1.amazonaws.com/ecommerce-platform:order-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: ORDER_DB_DSN
              value: "dbname=order_db user=microapp password=microapp123 host=postgres port=5432"
            - name: CATALOG_URL
              value: "http://catalog-service:8082"
            - name: INVENTORY_URL
              value: "http://inventory-service:8083"
            - name: NOTIFICATION_URL
              value: "http://notification-service:8086"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
