name: CI/CD - Build, Push to ECR & Update Helm Values

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecommerce-platform

jobs:
  validate-chart:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Ecommerce Helm Chart
        run: |
          helm lint helm/ecommerce
          helm template test-release helm/ecommerce > /dev/null
          echo "Helm chart is valid!"

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate-chart
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            path: services/auth-service
          - service: catalog-service
            path: services/catalog-service
          - service: inventory-service
            path: services/inventory-service
          - service: order-service
            path: services/order-service
          - service: payment-service
            path: services/payment-service
          - service: notification-service
            path: services/notification-service
          - service: analytics-service
            path: services/analytics-service
          - service: frontend
            path: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-git-manifests:
    name: Update Image Tags in Helm Values (GitOps)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Helm Values with New Image Tags
        env:
          TAG: ${{ github.sha }}
        run: |
          services=("auth" "catalog" "inventory" "order" "payment" "notification" "analytics")

          for s in "${services[@]}"; do
            sed -i -E "/^${s}:/,/^[a-z]/ s|(tag: [^ \n]+).*|tag: ${s}-service-${TAG}|" helm/ecommerce/values.yaml
          done
          sed -i -E "/^frontend:/,/^[a-z]/ s|(tag: [^ \n]+).*|tag: frontend-${TAG}|" helm/ecommerce/values.yaml

      - name: Commit and Push Updated Helm Values
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci(gitops): update helm image tags to ${GITHUB_SHA} [skip ci]"
            git push origin master
          fi
