name: CI/CD - Build, Push to ECR & Update Helm Values

on:
  push:
    branches: [ "master", "feature" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecommerce-platform

jobs:
  validate-chart:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Ecommerce Helm Chart
        run: |
          helm lint helm/ecommerce
          helm template test-release helm/ecommerce > /dev/null
          echo "Helm chart is valid!"

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate-chart
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            path: services/auth-service
          - service: catalog-service
            path: services/catalog-service
          - service: inventory-service
            path: services/inventory-service
          - service: order-service
            path: services/order-service
          - service: payment-service
            path: services/payment-service
          - service: notification-service
            path: services/notification-service
          - service: analytics-service
            path: services/analytics-service
          - service: cart-service
            path: services/cart-service
          - service: shipping-service
            path: services/shipping-service
          - service: reviews-service
            path: services/reviews-service
          - service: promotions-service
            path: services/promotions-service
          - service: search-service
            path: services/search-service
          - service: frontend
            path: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-git-manifests:
    name: Update Image Tags in GitOps Repository
    runs-on: ubuntu-latest
    needs: build-and-push
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature') && github.event_name == 'push'
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: rajkumargudala/ecommerce-gitops
          ref: ${{ github.ref == 'refs/heads/feature' && 'version-2' || 'main' }}
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Update Helm Values with New Image Tags
        env:
          TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          values_path = Path("gitops/helm/values.yaml")
          if not values_path.is_file():
              raise SystemExit(f"Expected GitOps values file at {values_path}")

          tag = os.environ["TAG"]
          image_tags = {
              "auth": f"auth-service-{tag}",
              "catalog": f"catalog-service-{tag}",
              "inventory": f"inventory-service-{tag}",
              "order": f"order-service-{tag}",
              "payment": f"payment-service-{tag}",
              "notification": f"notification-service-{tag}",
              "analytics": f"analytics-service-{tag}",
              "frontend": f"frontend-{tag}",
          }
          optional_image_tags = {
              "cart": f"cart-service-{tag}",
              "shipping": f"shipping-service-{tag}",
              "reviews": f"reviews-service-{tag}",
              "promotions": f"promotions-service-{tag}",
              "search": f"search-service-{tag}",
          }
          all_image_tags = {**image_tags, **optional_image_tags}

          lines = values_path.read_text().splitlines(keepends=True)
          current_section = None
          updated = set()
          for index, line in enumerate(lines):
              section_match = re.match(r"^([A-Za-z][A-Za-z0-9_-]*):\s*(?:#.*)?(?:\r?\n)?$", line)
              if section_match:
                  current_section = section_match.group(1)
              elif current_section in all_image_tags and re.match(r"^  tag:\s*", line):
                  newline = "\n" if line.endswith("\n") else ""
                  lines[index] = f"  tag: {all_image_tags[current_section]}{newline}"
                  updated.add(current_section)

          missing = sorted(set(image_tags) - updated)
          if missing:
              raise SystemExit("Missing top-level tag entries in GitOps values.yaml: " + ", ".join(missing))

          values_path.write_text("".join(lines))
          PY

      - name: Commit and Push Updated Helm Values
        env:
          GITOPS_BRANCH: ${{ github.ref == 'refs/heads/feature' && 'version-2' || 'main' }}
        run: |
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "github-actions[bot]@users.noreply.github.com"
          git -C gitops add helm/values.yaml
          if git -C gitops diff --cached --quiet; then
            echo "No changes to commit."
          else
            git -C gitops commit -m "ci(gitops): update image tags to ${GITHUB_SHA} [skip ci]"
            git -C gitops push origin "HEAD:${GITOPS_BRANCH}"
          fi
