server.port=8081
spring.application.name=auth-service
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://auth-db:5432/auth_db}
spring.datasource.username=${DB_USER:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_db_password_123}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
